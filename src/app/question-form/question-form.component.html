<form class="form" [formGroup]="questionForm" >
  <div class="form-content">

    <!-- Left Side: Options and Checkboxes -->
    <div class="form-left">
      <div class="form-group">
        <input type="text" formControlName="title" placeholder="Title" />
      </div>

      <div class="form-group">
        <select formControlName="difficulty" placeholder="Select Difficulty">
          <option value="" >Select Difficulty</option>
          <option value="Easy">Easy</option>
          <option value="Medium">Medium</option>
          <option value="Hard">Hard</option>
        </select>
      </div>

      <div class="form-group">
        <input type="text" formControlName="category" placeholder="Category" />
      </div>

      <div class="form-group">
        <input type="text" formControlName="subcategory" placeholder="Subcategory" />
      </div>
      <div class="form-group buttons">
        <button (click)="onSubmit()" class="btn btn-primary">Submit</button>
        <button class="btn btn-danger">Cancel</button>
      </div>
    </div>

    <!-- Right Side: Other Fields -->
    <div class="form-right">
           <div class="form-group">
        <textarea class="textarea" formControlName="question" rows="4" placeholder="Enter question here"></textarea>
      </div>
      <div formArrayName="options">
        <div *ngFor="let option of options.controls; let i = index" class="option-row">
          <input type="text" [formControlName]="i" placeholder="Option {{ i + 1 }}" />
          <label class="checkbox-label">
            <input
              type="checkbox"
              [checked]="correctAnswers.at(i).value"
              (change)="selectCorrect(i)"
            />
          </label>
        </div>
      </div>
    </div>
  </div>
</form>
