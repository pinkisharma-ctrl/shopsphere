<app-header></app-header>
<div class="profile-container">
  <img  class="bg" src="https://img.freepik.com/vecteurs-libre/illustration-concept-creativite_114360-2160.jpg">
    <form [formGroup]="profileForm" class="profile-form">
        <div class="form-group" style="text-align: center;">
            <img [src]="profileForm.value.avatar" alt="Avatar Preview" class="avatar-preview" /> 
   </div>
      <div class="form-group">
        <label>Name:</label>
        <input type="text" formControlName="name" />
      </div>
  
      <div class="form-group">
        <label>Email:</label>
        <input type="email" formControlName="email" />
      </div>
  
      <div class="form-group">
        <label>Role:</label>
        <input type="text" formControlName="role"  />
      </div>
  
   
  
      <div class="button-group">
        <button type="button" (click)="saveChanges()" [disabled]="!isFormChanged">Save</button>
        <button type="button" (click)="cancelChanges()">Cancel</button>
      </div>
    </form>
  </div>
