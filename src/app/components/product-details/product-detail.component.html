<app-header></app-header>
<div class="container py-5">
    <div class="row mb-5">
      <div class="col-md-6 text-center">
        <img [src]="product?.image" [alt]="product?.title" class="img-fluid" style="max-height: 400px; object-fit: contain;">
      </div>
      <div class="col-md-6">
        <h2>{{ product?.title }}</h2>
        <p class="text-muted">{{ product?.category }}</p>
        <h4 class="text-success">{{ product?.price | currencyFormat:'₹' }}</h4>
        <p>{{ product?.description }}</p>
        <button class="btn btn-primary mt-3" style="background-color: #7182e1;" (click)="addToCart(product)">Add to Cart</button>
      </div>
    </div>
    <div class="row similarProduct">
      <div class="col-12">
        <h4>Similar Products</h4>
        <div class="d-flex align-items-center justify-content-between mb-3">
          <button class="btn btn-outline-secondary" (click)="prevSlide()">Prev</button>
          <button class="btn btn-outline-secondary" (click)="nextSlide()">Next</button>
        </div>
        <div class="row">
          <div class="col-md-2" *ngFor="let similarProduct of similarProducts">
            <div class="card h-100">
              <img [src]="similarProduct.image" [alt]="similarProduct.title" class="card-img-top" style="height: 120px; object-fit: contain;">
              <div class="card-body">
                <h6 class="card-title">{{ similarProduct.title }}</h6>
                <p class="card-text text-success">{{ similarProduct.price | currencyFormat:'₹' }}</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
   <br>
   <div style="text-align: center;">
    <button  (click)="goToHome()">Back to Home Page</button>
   </div>
  </div>
